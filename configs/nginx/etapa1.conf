# --- Nginx proxy invers per a l'etapa 1 ---
# Accés al Thunderbird noVNC

# Thunderbird 1 (alumnat) - noVNC
server {
    listen 80;
    server_name thunderbird1.demoasixcloud2025.cat;

    location / {
        proxy_pass http://10.26.50.100:5800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# Accés directe per IP (pàgina d'índex)
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 200 '<!DOCTYPE html>
<html><head><title>Mail Lab - Proxy</title></head>
<body>
<h1>Laboratori de Servidors de Correu</h1>
<h2>Serveis disponibles:</h2>
<ul>
<li><a href="http://thunderbird1.demoasixcloud2025.cat">Thunderbird 1 (alumnat)</a></li>
</ul>
</body></html>';
        add_header Content-Type text/html;
    }
}
