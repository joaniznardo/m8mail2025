# Pàgina d'índex per defecte
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 200 '<!DOCTYPE html>
<html><head><title>Mail Lab - Proxy</title></head>
<body>
<h1>Laboratori de Servidors de Correu</h1>
<h2>Serveis disponibles:</h2>
<ul>
<li><a href="http://thunderbird1.demoasixcloud2025.cat">Thunderbird 1 (alumnat)</a></li>
<li><a href="http://thunderbird2.demoasixcloud2025.cat">Thunderbird 2 (professorat)</a></li>
<li><a href="http://roundcube.demoasixcloud2025.cat">Roundcube (webmail professorat)</a></li>
<li><a href="http://admin.professorat.demoasixcloud2025.cat">Stalwart Admin (professorat)</a></li>
<li><a href="http://mail.alumni.demoasixcloud2025.cat">Mailcow UI (alumni)</a></li>
</ul>
</body></html>';
        add_header Content-Type text/html;
    }
}
