# --- Nginx proxy invers per a l'etapa 6 ---
# Accés a tots els serveis: Thunderbird 1/2, Roundcube, Stalwart admin, Mailcow UI

# Thunderbird 1 (alumnat) - noVNC
server {
    listen 80;
    server_name thunderbird1.demoasixcloud2025.cat;

    location / {
        proxy_pass http://10.26.50.100:5800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# Thunderbird 2 (professorat) - noVNC
