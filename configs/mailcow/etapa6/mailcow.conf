# ============================================================================
# Mailcow - Configuració per a alumni.demoasixcloud2025.cat
# ============================================================================
# Mailcow és un stack multi-contenidor (~12 contenidors) que no es pot
# desplegar com a nodes individuals dins Containerlab.
#
# El desplegament real es fa via docker-compose al host, i es connecta
# a la xarxa del lab mitjançant el contenidor placeholder d'etapa 6.
#
# Passos de configuració:
# 1. Clonar Mailcow:
#    git clone https://github.com/mailcow/mailcow-dockerized.git /opt/mailcow
#
# 2. Executar el generador de configuració:
#    cd /opt/mailcow && ./generate_config.sh
#
# 3. Configurar mailcow.conf:
#    MAILCOW_HOSTNAME=mail.alumni.demoasixcloud2025.cat
#    MAILCOW_TZ=Europe/Madrid
#    HTTP_PORT=8082
#    HTTPS_PORT=8443
#    SKIP_LETS_ENCRYPT=y
#
# 4. Iniciar Mailcow:
#    cd /opt/mailcow && docker compose up -d
#
# 5. Connectar a la xarxa del lab:
#    Consulta les instruccions de l'etapa 6
#
# Comptes predefinits:
# - exalumne1@alumni.demoasixcloud2025.cat / Exalumne1.2025
# ============================================================================

MAILCOW_HOSTNAME=mail.alumni.demoasixcloud2025.cat
MAILCOW_TZ=Europe/Madrid
HTTP_PORT=8082
HTTPS_PORT=8443
SKIP_LETS_ENCRYPT=y
DBNAME=mailcow
DBUSER=mailcow
