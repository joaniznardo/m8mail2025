# documentation: https://rspamd.com/doc/modules/milter_headers.html

# Utilitzem NOMÉS la rutina personalitzada per generar Authentication-Results
# La rutina estàndard "authentication-results" no pot incloure dkim=pass
# per a missatges signats localment (usa task:get_dkim_results() que
# requereix verificació inbound, no disponible en submission port 587).
use = ["lab-auth-results"];

# Afegeix capçaleres també per a usuaris autenticats (submission)
authenticated_headers = ["lab-auth-results"];

# Rutina personalitzada que genera Authentication-Results complet
# incloent dkim=pass quan el missatge ha estat signat per Rspamd (DKIM_SIGNED)
custom {
    lab-auth-results = <<EOD
return function(task, common_meta)
  local dominated = task:has_symbol('DKIM_SIGNED')
  local parts = {}

  -- Identificador del servidor (authserv-id segons RFC 7601)
  -- task:get_hostname() retorna el rDNS del client, no el nom del servidor
  local hostname = "mail.alumnat.demoasixcloud2025.cat"
  table.insert(parts, hostname)

  -- DKIM: si DKIM_SIGNED present, afegir dkim=pass amb el domini
  if dominated then
    local sym = task:get_symbol('DKIM_SIGNED')
    local dkim_domain = "unknown"
    if sym and sym[1] and sym[1].options and sym[1].options[1] then
      dkim_domain = sym[1].options[1]:match("^([^:]+)") or "unknown"
    end
    table.insert(parts, "dkim=pass header.d=" .. dkim_domain)
  end

  -- SPF: comprovar símbols de verificació SPF
  if task:has_symbol('R_SPF_ALLOW') then
    local from = task:get_from('smtp')
    local mailfrom = from and from[1] and from[1].addr or ""
    table.insert(parts, "spf=pass smtp.mailfrom=" .. mailfrom)
  elseif task:has_symbol('R_SPF_FAIL') then
    table.insert(parts, "spf=fail")
  elseif task:has_symbol('R_SPF_SOFTFAIL') then
    table.insert(parts, "spf=softfail")
  elseif task:has_symbol('R_SPF_NEUTRAL') then
    table.insert(parts, "spf=neutral")
  elseif task:has_symbol('R_SPF_NA') then
    table.insert(parts, "spf=none")
  end

  -- DMARC: comprovar símbols de verificació DMARC
  if task:has_symbol('DMARC_POLICY_ALLOW') then
    local from = task:get_from('mime')
    local from_domain = from and from[1] and from[1].domain or ""
    table.insert(parts, "dmarc=pass header.from=" .. from_domain)
  elseif task:has_symbol('DMARC_POLICY_REJECT') then
    table.insert(parts, "dmarc=fail")
  elseif task:has_symbol('DMARC_POLICY_SOFTFAIL') then
    table.insert(parts, "dmarc=fail (policy=none)")
  elseif task:has_symbol('DMARC_POLICY_QUARANTINE') then
    table.insert(parts, "dmarc=fail (policy=quarantine)")
  elseif task:has_symbol('DMARC_NA') then
    table.insert(parts, "dmarc=none")
  end

  -- Construir la capçalera final
  if #parts <= 1 then
    return nil, {}, {}, {}
  end

  local ar_value = table.concat(parts, ";\r\n\t")
  return nil,
    {['Authentication-Results'] = ar_value},
    {['Authentication-Results'] = 0},
    {}
end
EOD;
}
